<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zosia is cool.">
    <title>ㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤㅤI'm sorry</title>
    <style>ㅤㅤㅤㅤㅤ
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .spacer {
            flex-grow: 1;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.2;
            text-align: center;
        }

        figure {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .image-link {
            display: inline-block;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .image-link:hover {
            opacity: 0.92;
            transform: scale(1.005);
        }

        img {
            max-width: 90vw;
            width: clamp(200px, 60vw, 500px);
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            display: block;
        }

        figcaption {
            margin-top: 24px;
            font-size: 0.95rem;
            font-style: italic;
            color: #a1a1aa;
            text-align: center;
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #71717a;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="spacer"></div>

    <div class="content-wrapper">
        <h1>Zosia I'm sorry :(</h1>
        
        <figure>
            <a href="https://raw.githubusercontent.com/ZosiaSiteOmg/zosiaiscool.com/main/zosia.jpeg" download="zosia.jpeg" class="image-link" title="Click to download image">
                <img src="https://raw.githubusercontent.com/ZosiaSiteOmg/zosiaiscool.com/main/zosia.jpeg" alt="Portrait of Zosia">
            </a>
            <figcaption>"I'm sorry" - you know</figcaption>
        </figure>
    </div>

    <div class="spacer"></div>

    <footer>
        <p>&copy; 2026 All rights reserved.</p>
    </footer>

</body>
</html>
