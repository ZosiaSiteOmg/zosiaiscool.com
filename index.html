<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zosia is cool — a tiny tribute page.">
  <title>Zosia is cool</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }

    :root {
      --fg:        #f6f6f8;
      --muted:     #9b9ba6;
      --accent:    #a78bfa;
      --accent-2:  #38bdf8;
      --card:      rgba(255, 255, 255, 0.04);
      --border:    rgba(255, 255, 255, 0.10);
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 48px);

      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      text-align: center;
      color: var(--fg);

      background:
        radial-gradient(60vmax 60vmax at 15% -10%, rgba(167, 139, 250, 0.18), transparent 60%),
        radial-gradient(50vmax 50vmax at 100% 110%, rgba(56, 189, 248, 0.15), transparent 60%),
        #07070b;
      background-attachment: fixed;
    }

    /* ---------- card ---------- */
    main {
      width: 100%;
      max-width: 620px;
      padding: clamp(24px, 5vw, 48px);

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      animation: rise 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    h1 {
      margin-bottom: clamp(20px, 4vw, 32px);
      font-size: clamp(2.1rem, 9vw, 4.25rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;

      color: #fff;
      background: linear-gradient(100deg, #ffffff 10%, var(--accent) 50%, var(--accent-2) 90%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    figure { margin: 0; }

    img {
      display: block;
      width: min(100%, 420px);
      height: auto;
      margin-inline: auto;

      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 18px 50px rgba(167, 139, 250, 0.22);

      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1),
                  box-shadow 0.4s ease;
    }

    @media (hover: hover) {
      img:hover {
        transform: translateY(-4px) scale(1.015);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 26px 65px rgba(167, 139, 250, 0.32);
      }
    }

    figcaption {
      margin-top: 28px;         
      font-size: clamp(0.95rem, 2.6vw, 1.1rem);
      font-style: italic;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Zosia is cool</h1>

    <figure>
      <img src="zosia.jpeg" alt="Portrait of Zosia">
      <figcaption>"yo" — Zosia</figcaption>
    </figure>
  </main>
</body>
</html>
