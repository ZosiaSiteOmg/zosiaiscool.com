<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zosia is cool — a tiny tribute page.">
  <title>Zosia is cool</title>
  <style>
    body {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #222;
      background-color: #fdfdfd;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    figure {
      margin: 0;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    figcaption {
      font-size: 0.95rem;
      color: #666;
    }
  </style>
</head>
<body>
  <main>
    <h1>Zosia is cool</h1>

    <figure>
      <img src="zosia.jpeg" alt="Portrait of Zosia">
      <figcaption>"yo" — Zosia</figcaption>
    </figure>
  </main>
</body>
</html>
