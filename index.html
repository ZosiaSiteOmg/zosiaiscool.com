<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zosia is cool.">
  <title>Zosia is cool</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      color: #f3f3f5;
      background-color: #050505;
    }

    main {
      width: 100%;
      max-width: 540px;
      padding: 32px 24px;
      background-color: #0f0f12;
      border: 1px solid #272730;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(1.2rem, 6.5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0;
      color: #ffffff;
      white-space: nowrap;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    figure {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .image-link {
      display: block;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #272730;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .image-link:hover {
      opacity: 0.92;
      transform: scale(1.005);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    figcaption {
      margin-top: 16px;
      font-size: 0.95rem;
      font-style: italic;
      color: #a1a1aa;
      text-align: center;
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.8rem;
      color: #71717a;
    }

    footer p {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

  <main>
    <header>
      <h1>The Zosia Website</h1>
    </header>

    <figure>
      <a href="https://raw.githubusercontent.com/ZosiaSiteOmg/zosiaiscool.com/main/zosia.jpeg" download="zosia.jpeg" class="image-link" title="Click to download image">
        <img src="https://raw.githubusercontent.com/ZosiaSiteOmg/zosiaiscool.com/main/zosia.jpeg" alt="Portrait of Zosia">
      </a>
      <figcaption>"yo" — Zosia</figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2026 All rights reserved.</p>
  </footer>

</body>
</html>
