<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zosia is cool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.2;
        }

        img {
            max-width: 90%;
            width: clamp(200px, 60vw, 500px);
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <h1>Zosia is cool</h1>
    <img src="zosia.jpeg" alt="Zosia">
</body>
</html>
